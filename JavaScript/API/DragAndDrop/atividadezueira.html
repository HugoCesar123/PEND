<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alimente o Rogério</title>

    <link rel="stylesheet" href="atividadezueira.css">
</head>

<body>

    <div class="container">

        <h1>🍽️ Alimente o Rogério</h1>

        <p class="subtitulo">
            Arraste um dos requisitos até o Rogério!
        </p>


        <!-- ROGÉRIO -->

        <div id="area-rogerio">

            <img
                id="rogerio"
                src="Gemini_Generated_Image_zbhhqozbhhqozbhh.png"
                alt="Rogério"
            >

            <div id="mensagem">
                😭 Rogério está com fome!
            </div>

        </div>


        <!-- REQUISITOS -->

        <h2>🍴 Requisitos para alimentar</h2>

        <div class="comidas">


            <div class="comida"
                 draggable="true"
                 data-comida="Mais Ego">

                <div class="emoji">😎</div>

                <span>Mais Ego</span>

            </div>


            <div class="comida"
                 draggable="true"
                 data-comida="Ração Pedigree">

                <div class="emoji">🐶</div>

                <span>Ração Pedigree</span>

            </div>


            <div class="comida"
                 draggable="true"
                 data-comida="Filho Hetero">

                <div class="emoji">👦</div>

                <span>Filho Hetero</span>

            </div>


            <div class="comida"
                 draggable="true"
                 data-comida="Ganhar de adolescente nos jogos">

                <div class="emoji">🎮</div>

                <span>Ganhar de adolescente nos jogos</span>

            </div>

        </div>


        <!-- BOTÃO -->

        <button id="botao-fome">
            🔄 Deixar o Rogério com fome
        </button>

    </div>


    <script src="atividadezueira.js"></script>

</body>

</html>
